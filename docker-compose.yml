services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "file:/data/app.db"
      UPLOADS_DIR: "/data/uploads"
      # Same-origin in production (Caddy fronts everything on one host), so
      # this is only relevant if you split the frontend out to its own origin.
      CORS_ORIGIN: "https://localhost"
    volumes:
      - proctor-diary-data:/data
    restart: unless-stopped
    # Not published to the host — only Caddy talks to this container
    # directly. The app enforces HTTPS and Secure cookies in production
    # (see backend/src/app.ts), so reaching it over bare HTTP on its own
    # port would leave login silently broken (the browser refuses to store
    # a Secure cookie set over plain HTTP) — Caddy is what makes that work.
    expose:
      - "4000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  proctor-diary-data:
  caddy-data:
  caddy-config:

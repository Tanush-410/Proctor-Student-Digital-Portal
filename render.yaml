# Render Blueprint — deploys the whole app (API + built frontend) from the
# existing Dockerfile as one free web service.
#
# Setup: Render dashboard -> Blueprints -> New Blueprint Instance -> connect this
# repo (branch tanimies). Render reads this file, then asks you for the two
# values marked `sync: false` (the Supabase connection strings).
#
# The database is Supabase (already hosted) — this only runs the app.
services:
  - type: web
    name: proctor-diary
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore # closest to the ap-northeast-2 Supabase project; also: oregon, frankfurt
    plan: free # no persistent disk, sleeps after 15 min idle (~50s cold start), plenty for a demo
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase connection strings — paste when prompted (Project -> Connect -> ORMs -> Prisma).
      # DATABASE_URL = transaction pooler :6543 with ?pgbouncer=true
      # DIRECT_URL   = session pooler :5432 (used by `prisma migrate deploy` on start)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: UPLOADS_DIR
        value: /data/uploads
      # Real OTP e-mail delivery. Without these, a production login code is
      # written only to the `otp_request` table in Supabase (not the response,
      # not the logs) — read it from the Table Editor, or set these to e-mail it.
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: SMTP_FROM
      #   sync: false
      # Used only to build the link in a notification e-mail (claim
      # submitted, proctee at-risk) — set to this service's own URL.
      # - key: APP_URL
      #   value: https://proctor-diary.onrender.com
    #
    # No persistent disk on the free plan — uploaded activity-point proof files
    # live under UPLOADS_DIR on the instance's ephemeral filesystem and are lost
    # on every redeploy/restart. To keep them, switch `plan` to `starter` and add:
    #   disk:
    #     name: proof-uploads
    #     mountPath: /data
    #     sizeGB: 1
